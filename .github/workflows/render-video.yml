name: Render Video

on:
  repository_dispatch:
    types: [render_video]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ghi scenes.json từ payload
        run: |
          cat <<'EOF' > scenes.json
          ${{ toJson(github.event.client_payload.scenes) }}
          EOF

      - name: Cài FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Render video (ngang + dọc)
        id: render
        run: |
          mkdir -p output
          set -o pipefail
          python3 scripts/render.py scenes.json output/ 2>&1 | tee render.log

      - name: Tạo tag phát hành
        id: tag
        run: echo "tag=render-${{ github.event.client_payload.video_id }}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Đăng GitHub Release kèm 2 bản video
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Video ${{ github.event.client_payload.video_id }}"
          files: |
            output/final_horizontal.mp4
            output/final_vertical.mp4
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gọi callback báo n8n
        if: github.event.client_payload.callback_url != ''
        run: |
          BASE_URL=$(echo '${{ steps.release.outputs.url }}' | sed 's#/tag/#/download/#')
          curl -s -X POST "${{ github.event.client_payload.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"video_id\": \"${{ github.event.client_payload.video_id }}\", \"status\": \"success\", \"video_url\": \"$BASE_URL/final_horizontal.mp4\", \"video_url_vertical\": \"$BASE_URL/final_vertical.mp4\"}"

      - name: Gọi callback báo lỗi (nếu render thất bại)
        if: failure() && github.event.client_payload.callback_url != ''
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, os
          log = ""
          if os.path.exists("render.log"):
              with open("render.log", "r", errors="replace") as f:
                  log = f.read()[-3000:]
          payload = json.dumps({
              "video_id": "${{ github.event.client_payload.video_id }}",
              "status": "error",
              "error_log": log,
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }).encode()
          req = urllib.request.Request(
              "${{ github.event.client_payload.callback_url }}",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          urllib.request.urlopen(req, timeout=30)
          PYEOF
